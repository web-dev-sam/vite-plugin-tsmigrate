[package]
name = "tsmigrate-layout"
version = "0.1.0"
edition = "2024"
publish = false

# The tool UI's force layout, compiled to a dependency-free wasm32 module and
# driven from a Web Worker (tool/src/graph/layout.worker.ts). Raw C ABI, no
# wasm-bindgen: the JS side reads/writes typed-array views over linear memory.
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
